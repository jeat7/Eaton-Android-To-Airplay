name: Eaton AirLink - Debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/eaton-airlink-branding-volume, feature/eaton-airlink-v1-smart-hub, feature/airlink-single-app-apk]

concurrency:
  group: airlink-debug-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
      - name: Build existing native AirPlay engine
        run: |
          chmod +x ./build.sh ./gradlew
          ./build.sh
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Eaton-AirLink-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
